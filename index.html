<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice Forge Pro v2 — multi-currency</title>
<style>
body{font-family:Georgia,serif;background:#f2f4f7;margin:0;color:#1c2430}
.sheet{max-width:820px;margin:18px auto;background:#fff;padding:34px 38px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0e5c3f;padding-bottom:14px}
h1{margin:0;font-size:1.5em;color:#0e5c3f}
.meta{text-align:right;font-size:.92em;color:#46586a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.card{background:#f7faf8;border:1px solid #d8e6de;border-radius:8px;padding:12px 14px;font-size:.95em}
.card b{color:#0e5c3f}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95em}
th{background:#0e5c3f;color:#fff;padding:8px;text-align:left}
td{border-bottom:1px solid #dde6e0;padding:8px}
.tot td{border:none;padding:4px 8px}
.tot .label{text-align:right;color:#46586a}.tot .val{text-align:right;width:150px;font-weight:bold}
.grand{font-size:1.15em;color:#0e5c3f;border-top:2px solid #0e5c3f}
.note{font-size:.85em;color:#5a6a78;margin-top:14px;line-height:1.5}
.controls{max-width:820px;margin:12px auto;background:#10261d;color:#cfe6d8;padding:14px 18px;border-radius:8px;font-size:.92em}
.controls input,.controls select,.controls button{font-size:.92em;padding:5px 7px;border-radius:5px;border:1px #3c6a55 solid;background:#0b1b14;color:#e8f4ec;margin:3px}
.controls button{cursor:pointer;background:#1c7a52;color:#fff;border:none}
.controls button:hover{background:#249e6a}
.itemrow button{background:#8b2f2f;border:none;color:#fff;cursor:pointer;border-radius:4px;padding:2px 7px}
@media print{.controls{display:none}.sheet{box-shadow:none;margin:0;max-width:100%}.itemrow button{display:none}}
</style></head><body>
<div class="controls">
<b>Invoice Forge Pro v2</b> — offline &middot; multi-currency &middot; data stays on your device
<br><input id="biz" size="24" placeholder="Your business name"><input id="cli" size="24" placeholder="Client name">
<input id="inv" size="8" placeholder="Inv #"><input id="date" size="9" placeholder="Date (YYYY-MM-DD)">
<select id="cur"><option>PKR</option><option>USD</option><option>EUR</option><option>GBP</option><option>AED</option><option>SAR</option></select>
<select id="taxpct"><option>0</option><option>5</option><option>7.5</option><option>13</option><option>16</option><option>18</option><option>20</option></select>%% tax
<select id="terms"><option>Due on receipt</option><option>Net 7</option><option>Net 15</option><option>Net 30</option></select>
<input id="pay" size="14" placeholder="Payment method"><input id="payacc" size="20" placeholder="Payment account / IBAN">
<input id="notes" size="26" placeholder="Notes (optional)">
<div id="items"></div>
<button onclick="addItem()">+ Add line item</button>
<button onclick="go()">Generate</button> <button onclick="window.print()">Print / Save PDF</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
var CUR={'PKR':'en-PK','USD':'en-US','EUR':'de-DE','GBP':'en-GB','AED':'en-AE','SAR':'en-SA'};
function fmt(n,c){try{return new Intl.NumberFormat(CUR[c],{style:'currency',currency:c,minimumFractionDigits:0,maximumFractionDigits:2}).format(n)}catch(e){return c+' '+n}}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
var ITEMS=[];
function addItem(d,q,r){ITEMS.push({d:d||'',q:q||1,r:r||0});drawItems()}
function rmItem(i){ITEMS.splice(i,1);drawItems()}
function drawItems(){
 var h='<table>';
 ITEMS.forEach(function(it,i){h+='<tr class="itemrow"><td><input size="30" placeholder="Item description" value="'+esc(it.d)+'" onchange="ITEMS['+i+'].d=this.value"></td><td><input size="3" type="number" value="'+it.q+'" onchange="ITEMS['+i+'].q=+this.value"></td><td><input size="8" type="number" value="'+it.r+'" onchange="ITEMS['+i+'].r=+this.value"></td><td><button onclick="rmItem('+i+')">x</button></td></tr>'});
 document.getElementById('items').innerHTML=h+'</table>';
}
function go(){
 var c=document.getElementById('cur').value,
 biz=esc(document.getElementById('biz').value||'Your Business'),cli=esc(document.getElementById('cli').value||'Client'),
 inv=esc(document.getElementById('inv').value||'INV-'+new Date().toISOString().slice(0,10).replace(/-/g,'')),
 date=esc(document.getElementById('date').value||new Date().toISOString().slice(0,10)),
 taxp=+document.getElementById('taxpct').value,terms=esc(document.getElementById('terms').value),
 pay=esc(document.getElementById('pay').value),payacc=esc(document.getElementById('payacc').value),notes=esc(document.getElementById('notes').value);
 var rows='',sub=0;
 ITEMS.forEach(function(it){if(!it.d)return;var a=it.q*it.r;sub+=a;
  rows+='<tr><td>'+esc(it.d)+'</td><td>'+it.q+'</td><td>'+fmt(it.r,c)+'</td><td style="text-align:right">'+fmt(a,c)+'</td></tr>'});
 if(!rows)rows='<tr><td colspan="4">(no line items)</td></tr>';
 var tax=sub*taxp/100,grand=sub+tax;
 document.getElementById('sheet').innerHTML=
 '<header><div><h1>'+biz+'</h1><div class="meta" style="text-align:left">Invoice '+inv+' &middot; '+c+'</div></div>'+
 '<div class="meta">Date: '+date+'<br>Terms: '+terms+'</div></header>'+
 '<div class="grid"><div class="card"><b>BILL TO</b><br>'+cli+'</div>'+
 '<div class="card"><b>PAYMENT</b><br>'+pay+(payacc?'<br>'+payacc:'')+'</div></div>'+
 '<table><tr><th>Description</th><th>Qty</th><th>Rate</th><th style="text-align:right">Amount</th></tr>'+rows+'</table>'+
 '<table class="tot"><tr><td class="label">Subtotal</td><td class="val">'+fmt(sub,c)+'</td></tr>'+
 '<tr><td class="label">Tax ('+taxp+'%)</td><td class="val">'+fmt(tax,c)+'</td></tr>'+
 '<tr class="grand"><td class="label">TOTAL DUE</td><td class="val">'+fmt(grand,c)+'</td></tr></table>'+
 '<div class="note">'+(notes?esc(notes)+'<br>':'')+'Invoice Forge Pro v2 - offline, multi-currency; no data leaves your device.</div>';
}
addItem('Monthly bookkeeping + invoice management',1,5000);addItem('Automated reminder setup',1,1500);go();
</script></body></html>
